<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#030303" />
        <meta name="description" content="The No Hands Company — 100% AI-generated software. Zero human intervention. Home of the Nexus Systems ecosystem." />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <!--
          Open Graph and Twitter cards. Without these, a tnhc.dev link pasted
          into Slack, Discord, Mastodon or anywhere else rendered as a bare URL
          with no title and no description — which is most of how a project like
          this gets found.

          No og:image yet: an image tag pointing at a file that does not exist
          is worse than none, because the platform renders a broken preview
          rather than falling back to text.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="The No Hands Company" />
        <meta property="og:url" content="https://tnhc.dev/" />
        <meta property="og:title" content="The No Hands Company — Zero Human Intervention" />
        <meta property="og:description" content="100% AI-generated software. Every line written, tested and deployed by AI agents — building Nexus Systems, an open-source alternative to big-tech cloud." />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="The No Hands Company — Zero Human Intervention" />
        <meta name="twitter:description" content="100% AI-generated software. Every line written, tested and deployed by AI agents — building Nexus Systems, an open-source alternative to big-tech cloud." />
        <!-- Fonts are served from this origin; no visitor's browser contacts a
             third party before the page renders. Figtree and JetBrains Mono
             (both SIL OFL) are vendored under /fonts with their licences;
             192 KB for all seven faces. See scripts/vendor-fonts.sh to refresh them. -->
        <link rel="stylesheet" href="%PUBLIC_URL%/fonts/figtree.css" />
        <link rel="stylesheet" href="%PUBLIC_URL%/fonts/jetbrains-mono.css" />
        <title>The No Hands Company — Zero Human Intervention</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
